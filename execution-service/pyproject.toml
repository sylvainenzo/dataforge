[project]
name = "dataforge-execution-service"
version = "0.1.0"
description = "DataForge Execution Gateway + Orchestrator — Phase 7. A separate deployable from the Core API, per Phase 1 §3/§7: the one component that runs untrusted user code, isolated as its own security boundary."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
