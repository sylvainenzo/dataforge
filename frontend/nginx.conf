server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unmatched path serves index.html and lets
    # React Router decide what to render client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for hashed asset filenames (Vite content-hashes
    # every build output); index.html itself is never cached so a new
    # deploy is picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
